[package]
name = "memoka-desktop"
version = "0.1.5"
description = "Memoka local-first structured notes desktop application"
edition = "2024"
publish = false
default-run = "memoka"
authors = ["Jun Ando"]
license = "MIT"
repository = "https://github.com/memoka-project/memoka"

[features]
default = []
windows-clipboard-contract = []

[lib]
name = "memoka_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "memoka"
path = "src/main.rs"

[[bin]]
name = "memoka-cli"
path = "src/bin/memoka-cli.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
log = "0.4.29"
toml = "0.8.2"
toml_edit = "0.20.2"
unicode-normalization = "0.1"
yrs = "0.27.3"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gio = "0.18.4"
gtk = "0.18.2"
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_Ime",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_Ime",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
