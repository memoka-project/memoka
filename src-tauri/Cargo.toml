[package]
name = "memoka-desktop"
version = "0.2.0"
description = "Memoka local-first structured notes desktop application"
edition = "2024"
publish = false
default-run = "memoka"
authors = ["Jun Ando"]
license = "MIT"
repository = "https://github.com/memoka-project/memoka"

[features]
default = []
windows-clipboard-contract = []

[lib]
name = "memoka_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "memoka"
path = "src/main.rs"

[[bin]]
name = "memoka-cli"
path = "src/bin/memoka-cli.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
log = "0.4.29"
toml = "0.8.2"
toml_edit = "0.20.2"
unicode-normalization = "0.1"
yrs = "0.27.3"
uuid = { version = "1.24.0", features = ["v7"] }
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4.3"
interprocess = "=2.4.2"
tempfile = "3.23.0"
dirs = "6.0.0"
rpassword = "7.4.0"
oauth2 = { version = "=5.0.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
url = "2.5.8"
rand = "0.8.8"
zeroize = "1.9.0"
base64 = "0.22.1"
process-wrap = { version = "=10.0.0", features = ["std"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2.189"
gdk = "0.18.2"
gio = "0.18.4"
gtk = "0.18.2"
gdk-pixbuf = "0.18.5"
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
widestring = "1.2.1"
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_Ime",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_Ime",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
