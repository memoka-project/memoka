name: Build Linux release draft

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing product version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify the committed third-party inventory
        run: |
          corepack pnpm release:notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - id: version
        name: Verify one canonical version
        shell: bash
        run: |
          version="$(node scripts/check-release-version.mjs --version='${{ inputs.version }}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: corepack pnpm verify
      - run: corepack pnpm large-note-gate

  build-linux:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: release-signing
    env:
      MEMOKA_UPDATER_PUBLIC_KEY: ${{ vars.MEMOKA_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Create release-only Tauri configuration
        run: node scripts/prepare-release-config.mjs --platform=linux
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.validate.outputs.version }}
          releaseName: Memoka v${{ needs.validate.outputs.version }}
          releaseBody: Linux x86_64 AppImage release. Windows is distributed as source code only. See CHANGELOG.md. This draft must pass the native release gate before publication.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.generated.json
      - name: Build standalone recovery CLI
        run: corepack pnpm cli:build
      - name: Stage recovery CLI
        run: node scripts/stage-cli-release.mjs
      - name: Archive CLI on Linux
        shell: bash
        run: tar -C dist-release -czf dist-release/memoka-cli-v${{ needs.validate.outputs.version }}-linux-x64.tar.gz memoka-cli-v${{ needs.validate.outputs.version }}-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-support
          if-no-files-found: error
          path: dist-release/*.tar.gz

  finalize:
    needs: [validate, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-support
          path: release-assets
      - name: Upload standalone CLI archives to the existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          find release-assets -type f -name '*.tar.gz' -print0 | xargs -0 gh release upload "v${{ needs.validate.outputs.version }}" --clobber
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: memoka-v${{ needs.validate.outputs.version }}.spdx.json
      - name: Download and validate the complete draft asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm -rf release-assets
          mkdir release-assets
          gh release download "v${{ needs.validate.outputs.version }}" --dir release-assets
          latest_json="$(find release-assets -type f -name latest.json -print -quit)"
          test -n "$latest_json"
          jq -e '.platforms | length >= 1 and all(keys[]; startswith("linux-"))' "$latest_json"
          test -n "$(find release-assets -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -type f -name '*.AppImage.sig' -print -quit)"
          if find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print -quit | grep -q .; then
            echo 'Windows binaries must not be attached to a public release' >&2
            exit 1
          fi
      - name: Generate portable SHA-256 checksums
        shell: bash
        run: |
          declare -A seen=()
          : > SHA256SUMS.unsorted
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [[ -n "${seen[$name]:-}" ]]; then
              echo "duplicate release asset basename: $name" >&2
              exit 1
            fi
            seen[$name]=1
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$name" >> SHA256SUMS.unsorted
          done < <(find release-assets -type f -print0)
          sbom="memoka-v${{ needs.validate.outputs.version }}.spdx.json"
          printf '%s  %s\n' "$(sha256sum "$sbom" | cut -d ' ' -f 1)" "$sbom" >> SHA256SUMS.unsorted
          sort -k2 SHA256SUMS.unsorted > SHA256SUMS
          rm SHA256SUMS.unsorted
      - name: Upload checksums and SBOM to the existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "v${{ needs.validate.outputs.version }}" SHA256SUMS "memoka-v${{ needs.validate.outputs.version }}.spdx.json" --clobber
